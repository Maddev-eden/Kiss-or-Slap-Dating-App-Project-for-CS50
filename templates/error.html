<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiss or Slap - Error</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="page-error">
  <div class="error-card">
    <div class="error-icon"><i class="fa-solid fa-hand-back-fist"></i></div>
    <div class="error-code">{{ error_code|default(404) }}</div>
    <div class="error-title">{{ error_title|default('You Got Slapped Away!') }}</div>
    <p class="error-desc">{{ error_message|default("The page you are looking for doesn't exist, was removed, or is temporarily unavailable in your Elo Bucket.") }}</p>
    <a href="{{ url_for('home') }}" class="btn-home">
      <i class="fa-solid fa-house"></i> Back to Safety
    </a>
  </div>
</body>
</html>
