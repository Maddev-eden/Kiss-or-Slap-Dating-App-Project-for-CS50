{% extends "index.html" %}

{% block title %}Edit {{ field_info.title }}{% endblock %}

{% block content %}
<div class="content-wrapper" style="max-width: 500px; margin: 40px auto; padding: 20px;">
  <div style="background: #1e1e24; border-radius: 12px; padding: 30px; border: 1px solid #2d2d3a;">
    <h2 style="color: #fff; margin-top: 0; margin-bottom: 8px;">Edit {{ field_info.title }}</h2>
    <p style="color: #888; font-size: 14px; margin-bottom: 25px;">Update your {{ field_info.title | lower }} below.</p>

    <form method="POST" action="{{ url_for('edit_setting', setting_type=setting_type) }}" enctype="multipart/form-data">
      <div style="margin-bottom: 20px;">
        <label style="display: block; color: #aaa; font-size: 13px; font-weight: bold; margin-bottom: 8px;">
          New {{ field_info.title }}
        </label>
        
        {% if field_info.type == 'file' %}
          <input type="file" name="value" required
                 style="width: 100%; padding: 10px; background: #121214; border: 1px solid #2d2d3a; border-radius: 8px; color: #fff;">
        {% else %}
          <input type="{{ field_info.type }}" name="value" value="{{ current_value }}" required
                 placeholder="Enter new {{ field_info.title | lower }}"
                 style="width: 100%; padding: 12px; background: #121214; border: 1px solid #2d2d3a; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box;">
        {% endif %}
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;">
        <a href="{{ url_for('account') }}" 
           style="padding: 10px 20px; background: #2a2a32; color: #aaa; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px;">
          Cancel
        </a>
        <button type="submit" 
                style="padding: 10px 20px; background: #ff4757; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
