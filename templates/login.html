<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiss or Slap - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="page-auth page-login">
  <div class="auth-card">
    <div class="brand-logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Kiss or Slap Logo">
      <h1>Kiss/Slap</h1>
    </div>

    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Enter your credentials to access your account</p>
    </div>

    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}

    <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="********" required>
        </div>
      </div>

      <div class="form-actions">
        <label class="remember-label">
          <input class="remember-input" type="checkbox"> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a>
    </div>
  </div>
</body>
</html>
